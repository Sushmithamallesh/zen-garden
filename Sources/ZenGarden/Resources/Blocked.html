<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zen Garden · Blocked</title>
  <style>
    @font-face {
      font-family: "Inter";
      src: url("InterVariable.woff2") format("woff2-variations");
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
    }

    :root {
      color-scheme: light dark;
      --paper: #f5f0e2;
      --surface: rgba(255, 252, 243, .95);
      --ink: #0e281a;
      --muted: #4f604f;
      --moss: #6d7f31;
      --moss-soft: rgba(109, 127, 49, .09);
      --vermilion: #d5422d;
      --vermilion-halo: rgba(213, 66, 45, .12);
      --edge: rgba(36, 49, 25, .10);
      --shadow: rgba(41, 49, 21, .20);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      margin: 0;
    }

    html {
      min-height: 100%;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 32px;
      overflow: hidden;
      background-color: var(--paper);
      background-image:
        linear-gradient(
          to bottom,
          rgba(255, 252, 243, .42),
          rgba(245, 240, 226, .08),
          rgba(61, 77, 30, .10)
        ),
        url("ZenGardenHeroBrowser.jpg");
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      color: var(--ink);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      font-feature-settings: "liga" 1, "calt" 1, "cv11" 1;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(500px, 100%);
      overflow: hidden;
      border-radius: 28px;
      background: var(--surface);
      box-shadow:
        0 0 0 1px var(--edge),
        0 2px 5px rgba(0, 0, 0, .05),
        0 22px 60px var(--shadow);
      backdrop-filter: blur(18px);
    }

    .content {
      padding: 34px 36px 32px;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin: 0 0 30px;
    }

    .brand,
    .status {
      display: flex;
      align-items: center;
      margin: 0;
      font-size: 12px;
      font-weight: 650;
    }

    .brand {
      gap: 9px;
      color: var(--muted);
      letter-spacing: -.01em;
    }

    .brand-mark {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border-radius: 9px;
      background: var(--moss);
      color: #fffdf4;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .16);
    }

    .brand-mark svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
    }

    .status {
      gap: 7px;
      color: var(--muted);
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .status::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--vermilion);
      box-shadow: 0 0 0 4px var(--vermilion-halo);
      content: "";
    }

    h1 {
      margin: 0;
      font-size: clamp(36px, 4.5vw, 46px);
      font-weight: 670;
      line-height: 1.02;
      letter-spacing: -.045em;
      text-wrap: balance;
    }

    .message {
      margin: 20px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
      text-wrap: pretty;
    }

    .domain {
      color: var(--ink);
      font-weight: 600;
    }

    .footer {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 17px 36px 18px;
      border-top: 1px solid var(--edge);
      background: var(--moss-soft);
    }

    .footer-icon {
      display: grid;
      flex: 0 0 auto;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 10px;
      background: var(--surface);
      color: var(--moss);
      box-shadow: 0 0 0 1px var(--edge);
    }

    .footer-icon svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
    }

    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      text-wrap: pretty;
    }

    .hint strong {
      display: block;
      margin-bottom: 1px;
      color: var(--ink);
      font-weight: 650;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #11140d;
        --surface: rgba(27, 34, 24, .92);
        --ink: #f3f0e2;
        --muted: #c4c9b3;
        --moss: #a9bf69;
        --moss-soft: rgba(169, 191, 105, .08);
        --vermilion: #f16f5b;
        --vermilion-halo: rgba(241, 111, 91, .14);
        --edge: rgba(255, 255, 255, .10);
        --shadow: rgba(0, 0, 0, .34);
      }

      body {
        background-image:
          linear-gradient(
            to bottom,
            rgba(12, 16, 10, .34),
            rgba(12, 16, 10, .20),
            rgba(7, 10, 6, .36)
          ),
          url("ZenGardenHeroBrowser.jpg");
      }
    }

    @media (max-width: 600px) {
      body { padding: 20px; }
      main { border-radius: 24px; }
      .content { padding: 30px 28px 28px; }
      .footer { padding: 16px 28px 17px; }
      .status { font-size: 10px; }
    }

    @media (prefers-reduced-transparency: reduce) {
      main {
        background: var(--surface);
        backdrop-filter: none;
      }
    }

    @media (prefers-contrast: more) {
      main { box-shadow: 0 0 0 2px currentColor; }
      .message { color: var(--ink); }
      .hint { color: var(--ink); }
    }
  </style>
</head>
<body>
  <main>
    <div class="content">
      <div class="topline">
        <p class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M20.8 4.1c-6.3-.4-11.6 1.2-14.8 4.4-2.7 2.7-3.5 6.2-1.7 8.5 1.8 2.4 5.5 2.5 8.5.5 3.4-2.2 5.1-6.7 8-13.4ZM5.6 18.9c2.7-3.2 6.3-6.3 11.2-9.2-3.8 3.4-6.8 6.8-9 10.2l-2.2-1Z"/>
            </svg>
          </span>
          Zen Garden
        </p>
        <p class="status">Focus active</p>
      </div>

      <h1>Website blocked</h1>
      <p class="message"><span class="domain" id="domain">This website</span> is blocked while focus is active.</p>
    </div>

    <div class="footer">
      <span class="footer-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M20.8 4.1c-6.3-.4-11.6 1.2-14.8 4.4-2.7 2.7-3.5 6.2-1.7 8.5 1.8 2.4 5.5 2.5 8.5.5 3.4-2.2 5.1-6.7 8-13.4ZM5.6 18.9c2.7-3.2 6.3-6.3 11.2-9.2-3.8 3.4-6.8 6.8-9 10.2l-2.2-1Z"/>
        </svg>
      </span>
      <p class="hint"><strong>Temporary access</strong>Choose “Unblock a website” from the menu bar.</p>
    </div>
  </main>

  <script>
    const attemptedDomain = decodeURIComponent(window.location.hash.slice(1));
    if (attemptedDomain) document.getElementById('domain').textContent = attemptedDomain;
  </script>
</body>
</html>
