<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zen Garden · Blocked</title>
  <style>
    :root {
      color-scheme: light dark;
      --paper: #f5f0e2;
      --paper-light: #fffaf0;
      --ink: #0e281a;
      --muted: #385043;
      --moss: #68792d;
      --accent-ink: #45541f;
      --pine: #6f8033;
      --matcha-light: #aab866;
      --rake-line: rgba(197, 31, 19, 0.18);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    html { -webkit-font-smoothing: antialiased; }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      background-color: var(--paper);
      background-image:
        linear-gradient(
          to bottom,
          rgba(254, 251, 242, .64),
          rgba(245, 240, 224, .18),
          rgba(110, 128, 51, .08)
        ),
        url("ZenGardenHeroBrowser.jpg");
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(560px, calc(100% - 48px));
      padding: 46px 48px;
      border: 1px solid rgba(255,255,255,.72);
      border-radius: 26px;
      background: rgba(254, 251, 242, .90);
      box-shadow: 0 30px 80px rgba(69,84,31,.12);
      backdrop-filter: blur(14px);
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 14px;
      color: var(--accent-ink);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .19em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--moss);
      content: "";
    }

    h1 {
      max-width: 520px;
      margin: 0;
      font-size: clamp(36px, 5vw, 57px);
      font-weight: 510;
      line-height: 1.05;
      letter-spacing: -.035em;
      text-wrap: balance;
    }

    .message {
      max-width: 440px;
      margin: 22px 0 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.55;
      text-wrap: pretty;
    }

    .domain {
      display: inline-block;
      margin-top: 31px;
      padding: 9px 14px;
      border-radius: 999px;
      background: rgba(88, 107, 77, .10);
      color: var(--accent-ink);
      font-size: 13px;
      font-weight: 650;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #11140d;
        --paper-light: #1b2015;
        --ink: #f3f0e2;
        --muted: #bdc4a6;
        --moss: #97aa5f;
        --accent-ink: #c4d08c;
        --pine: #63762c;
        --matcha-light: #afc273;
        --rake-line: rgba(240, 105, 84, .20);
      }

      body {
        background-image:
          linear-gradient(
            to bottom,
            rgba(17, 20, 13, .72),
            rgba(17, 20, 13, .42),
            rgba(0, 0, 0, .50)
          ),
          url("ZenGardenHeroBrowser.jpg");
      }

      main {
        border-color: rgba(255, 255, 255, .10);
        background: rgba(27, 32, 21, .91);
        box-shadow: 0 30px 80px rgba(0, 0, 0, .48);
      }

      .domain { background: rgba(175, 194, 115, .12); }
    }

    @media (max-width: 600px) {
      main { padding: 38px 30px; }
    }

    @media (prefers-reduced-transparency: reduce) {
      main {
        background: var(--paper-light);
        backdrop-filter: none;
      }
    }

    @media (prefers-contrast: more) {
      main { border-color: rgba(14, 40, 26, .42); }
      .message { color: var(--ink); }
    }

    @media (prefers-color-scheme: dark) and (prefers-contrast: more) {
      main { border-color: rgba(255, 255, 255, .42); }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Focus active</p>
    <h1>Website blocked</h1>
    <p class="message">Use Zen Garden in the menu bar to unblock it briefly.</p>
    <div class="domain" id="domain">Blocked website</div>
  </main>

  <script>
    const attemptedDomain = decodeURIComponent(window.location.hash.slice(1));
    if (attemptedDomain) document.getElementById('domain').textContent = attemptedDomain;
  </script>
</body>
</html>
