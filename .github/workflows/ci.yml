name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Show Swift toolchain
        run: swift --version

      - name: Test domain and schedule logic
        run: ./scripts/test-core.sh

      - name: Compile the app
        env:
          ZEN_GARDEN_WARNINGS_AS_ERRORS: "1"
        run: ./scripts/build-app.sh

      - name: Verify packaged downloads
        run: ./scripts/verify-build.sh
