name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Show Swift toolchain
        run: swift --version

      - name: Test domain and schedule logic
        run: ./scripts/test-core.sh

      - name: Compile the app
        run: ./scripts/build-app.sh
